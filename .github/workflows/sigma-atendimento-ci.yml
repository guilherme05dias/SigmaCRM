name: Sigma Atendimento CI

on:
  push:
    paths:
      - "SigmaAtendimento/**"
      - ".github/workflows/sigma-atendimento-ci.yml"
  pull_request:
    paths:
      - "SigmaAtendimento/**"
      - ".github/workflows/sigma-atendimento-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # O Prisma exige URLs sintaticamente válidas para validar o schema.
      # Nenhuma conexão é aberta durante generate/validate/typecheck.
      DATABASE_URL: postgresql://sigma:sigma@127.0.0.1:5432/sigma
      DIRECT_URL: postgresql://sigma:sigma@127.0.0.1:5432/sigma
    defaults:
      run:
        working-directory: SigmaAtendimento

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SigmaAtendimento/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
