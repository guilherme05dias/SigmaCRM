# Render Blueprint - SigmaCRM API
# Este arquivo fica na raiz do repositorio; rootDir aponta para o monorepo.
services:
  - type: web
    name: sigmacrm-api
    runtime: node
    plan: free
    region: virginia
    rootDir: SigmaAtendimento
    buildCommand: npm ci --include=dev && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PROVIDER
        value: uazapi
      - key: SUPABASE_URL
        value: https://fiayxnorzxvrxambetds.supabase.co
      - key: DEFAULT_COMPANY_ID
        value: d397c7ba-3133-4ce0-afda-c27566fb025f
      - key: SIGMA_DEFAULT_COMPANY_ID
        value: d397c7ba-3133-4ce0-afda-c27566fb025f
      - key: UAZAPI_BASE_URL
        value: https://free.uazapi.com
      - key: UAZAPI_DEFAULT_SESSION_ID
        value: sigma-teste4
      - key: UAZAPI_SEND_TEXT_PATH
        value: /send/text
      - key: UAZAPI_SEND_VIA_SUPABASE_EDGE
        value: "true"
      - key: UAZAPI_RECONCILIATION_ENABLED
        value: "true"
      - key: UAZAPI_RECONCILIATION_INTERVAL_MS
        value: "60000"
      - key: UAZAPI_RECONCILIATION_LOOKBACK_HOURS
        value: "48"
      # O assistente Ollama depende de um modelo local e fica desligado no Render.
      - key: ASSISTANT_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: https://sigmacrm-web.vercel.app
      # Segredos preenchidos somente no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UAZAPI_TOKEN
        sync: false
      - key: SIGMA_INTERNAL_TOKEN
        sync: false
      - key: UAZAPI_WEBHOOK_SECRET
        sync: false
